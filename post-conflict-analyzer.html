<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post-Conflict Market Analyzer</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        function PostConflictMarketAnalyzer() {
            const [conflict, setConflict] = useState('');
            const [company, setCompany] = useState('');
            const [analyzing, setAnalyzing] = useState(false);
            const [results, setResults] = useState(null);
            const [activeTab, setActiveTab] = useState('market');

            const conflicts = [
                "Ukraine-Russia War",
                "Gaza Conflict",
                "Venezuela Crisis",
                "Myanmar Civil War",
                "Sudan Conflict"
            ];

            const companies = [
                "Caterpillar",
                "Ericsson",
                "Toyota",
                "Siemens",
                "Coca-Cola",
                "EcoFlow",
                "WOTA",
                "John Deere",
                "Nokia",
                "Bechtel"
            ];

            const handleAnalyze = () => {
                setAnalyzing(true);
                setTimeout(() => {
                    setResults({
                        scenarios: [
                            {
                                title: "Scenario A: Complete Ceasefire & NATO Membership",
                                probability: "25%",
                                marketSize: "$380B",
                                revenue: "$30B over 5 years",
                                impact: "+9%"
                            },
                            {
                                title: "Scenario B: Partial Peace & Neutrality",
                                probability: "45%",
                                marketSize: "$180B",
                                revenue: "$15B over 5 years",
                                impact: "+4%"
                            },
                            {
                                title: "Scenario C: Frozen Conflict",
                                probability: "30%",
                                marketSize: "$50B",
                                revenue: "$5B over 5 years",
                                impact: "+1%"
                            }
                        ],
                        expectedValue: {
                            revenue: "$18.5B",
                            impact: "+5.2%"
                        },
                        strategies: {
                            corporate: [
                                {
                                    title: "Rebuild Ukraine Campaign",
                                    details: [
                                        "Donate 100 construction machines ($50M value) to Ukrainian reconstruction efforts",
                                        "Partner with Ukrainian government for school and hospital rebuilding",
                                        "Document and broadcast reconstruction efforts globally via documentary series"
                                    ],
                                    expected: "+20% brand value, Secured market share, Improved ESG rating",
                                    investment: "$50M"
                                },
                                {
                                    title: "Humanitarian Equipment Program",
                                    details: [
                                        "Provide debris removal equipment to war-affected cities",
                                        "Train 500 local operators",
                                        "Create educational content about reconstruction"
                                    ],
                                    expected: "Positive global PR, Local workforce development, Future market penetration",
                                    investment: "$15M"
                                }
                            ],
                            lobbying: [
                                {
                                    title: "US Congress Advocacy",
                                    details: [
                                        "Support bipartisan 'Ukraine Reconstruction Act'",
                                        "Lobby for 50% preference for US companies in reconstruction contracts",
                                        "Partner with USAID on reconstruction planning"
                                    ],
                                    expected: "Access to $100B in preferential contracts",
                                    investment: "$10M"
                                }
                            ],
                            summary: {
                                total: "$75M",
                                expectedReturn: "$30B",
                                roi: "400x"
                            }
                        },
                        caseStudies: [
                            {
                                company: "Coca-Cola",
                                initiative: "Small World Machines",
                                region: "India-Pakistan Border",
                                description: "Installed video call machines at the border, enabling civilians from both countries to connect and share a Coke",
                                result: "100M video views, +20% brand favorability, UN recognition"
                            },
                            {
                                company: "Unilever",
                                initiative: "Refugee Employment Program",
                                region: "Syria",
                                description: "Employed 2,000 refugee women in manufacturing facilities",
                                result: "+5% sales growth, ESG leadership award, Massive positive PR"
                            },
                            {
                                company: "Ericsson",
                                initiative: "Refugees Connected",
                                region: "Middle East & Africa",
                                description: "Provided free telecommunications infrastructure in refugee camps",
                                result: "1M people connected to families, UN partnership, Increased brand value"
                            },
                            {
                                company: "IKEA",
                                initiative: "Better Shelter",
                                region: "Syrian Refugee Crisis",
                                description: "Developed and deployed low-cost temporary housing units ($1,000 per unit)",
                                result: "30,000 units deployed, New profitable business line established"
                            },
                            {
                                company: "Airbnb",
                                initiative: "Open Homes for Ukrainian Refugees",
                                region: "Ukraine",
                                description: "Enabled hosts to provide free accommodation for refugees fleeing the war",
                                result: "100,000 refugees housed, Unprecedented positive global PR"
                            }
                        ]
                    });
                    setAnalyzing(false);
                    setActiveTab('market');
                }, 2000);
            };

            return (
                <div className="min-h-screen bg-gradient-to-br from-slate-950 via-purple-950 to-slate-950 py-12 px-6">
                    <div className="max-w-7xl mx-auto">
                        
                        {/* Hero Section */}
                        <div className="text-center mb-12">
                            <h1 className="text-5xl md:text-6xl font-bold text-white text-center mb-6">
                                Post-Conflict Market Analyzer
                            </h1>
                            <p className="text-2xl text-purple-300 text-center mb-8">
                                Quantify the business case for peace
                            </p>
                        </div>

                        {/* Mission Statement */}
                        <div className="bg-white/10 backdrop-blur-lg border border-purple-500/30 shadow-xl rounded-lg mb-12 p-8">
                            <h2 className="text-3xl font-bold text-white mb-6 flex items-center gap-3">
                                <svg className="w-8 h-8 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <circle cx="12" cy="12" r="10" strokeWidth="2"/>
                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
                                </svg>
                                Our Mission
                            </h2>
                            <div className="space-y-6 text-lg">
                                <div>
                                    <p className="text-gray-200 leading-relaxed">
                                        <span className="text-2xl mr-2">📊</span>
                                        <strong className="text-white">Surface Goal:</strong> Predict quantifiable market opportunities for companies when conflicts end
                                    </p>
                                </div>
                                <div>
                                    <p className="text-gray-200 leading-relaxed">
                                        <span className="text-2xl mr-2">🕊️</span>
                                        <strong className="text-white">Deeper Goal:</strong> Inspire companies to actively contribute to conflict resolution by showing them what they stand to gain—and asking: What can YOU do to help end the war?
                                    </p>
                                </div>
                                <div>
                                    <p className="text-gray-200 leading-relaxed">
                                        <span className="text-2xl mr-2">💡</span>
                                        <strong className="text-white">Ultimate Vision:</strong> Spark global dialogue and action toward ending conflicts worldwide
                                    </p>
                                </div>
                            </div>
                        </div>

                        {/* How to Use */}
                        <div className="mb-12">
                            <h2 className="text-2xl font-bold text-white mb-4">How to Use</h2>
                            <div className="text-lg text-gray-200 space-y-3 leading-relaxed">
                                <p>1️⃣ Select a conflict and a company</p>
                                <p>2️⃣ Click 'Analyze' to see market projections and strategic recommendations</p>
                                <p>3️⃣ Reflect on the critical question: What can this company do to help end the war?</p>
                            </div>
                        </div>

                        {/* Input Section */}
                        <div className="bg-white/5 backdrop-blur-lg border border-white/10 shadow-xl rounded-lg mb-12 p-8">
                            <div className="grid grid-cols-2 gap-6 mb-6">
                                <div>
                                    <label className="block text-white text-lg mb-3 font-semibold">Select Conflict</label>
                                    <select 
                                        value={conflict} 
                                        onChange={(e) => setConflict(e.target.value)}
                                        className="w-full bg-white/10 border border-white/20 text-white text-lg py-3 px-4 rounded-lg"
                                    >
                                        <option value="">Choose a conflict</option>
                                        {conflicts.map(c => (
                                            <option key={c} value={c} className="bg-slate-900">{c}</option>
                                        ))}
                                    </select>
                                </div>

                                <div>
                                    <label className="block text-white text-lg mb-3 font-semibold">Select Company</label>
                                    <select 
                                        value={company} 
                                        onChange={(e) => setCompany(e.target.value)}
                                        className="w-full bg-white/10 border border-white/20 text-white text-lg py-3 px-4 rounded-lg"
                                    >
                                        <option value="">Choose a company</option>
                                        {companies.map(c => (
                                            <option key={c} value={c} className="bg-slate-900">{c}</option>
                                        ))}
                                    </select>
                                </div>
                            </div>

                            <div className="flex justify-center">
                                <button
                                    onClick={handleAnalyze}
                                    disabled={!conflict || !company || analyzing}
                                    className="bg-gradient-to-r from-purple-600 to-purple-700 hover:from-purple-700 hover:to-purple-800 text-white text-lg px-8 py-4 rounded-lg disabled:opacity-50 transition-all duration-200 font-semibold"
                                >
                                    {analyzing ? (
                                        <span className="flex items-center gap-2">
                                            <svg className="animate-spin h-5 w-5" viewBox="0 0 24 24">
                                                <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4" fill="none"/>
                                                <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"/>
                                            </svg>
                                            Analyzing...
                                        </span>
                                    ) : (
                                        'Analyze Market Opportunity'
                                    )}
                                </button>
                            </div>
                        </div>

                        {/* Results Section */}
                        {results && (
                            <div>
                                {/* Tabs */}
                                <div className="bg-white/5 backdrop-blur-lg border border-white/10 rounded-lg p-2 mb-8">
                                    <div className="grid grid-cols-4 gap-2">
                                        {['market', 'question', 'strategy', 'cases'].map((tab) => (
                                            <button
                                                key={tab}
                                                onClick={() => setActiveTab(tab)}
                                                className={`py-3 px-4 rounded-lg font-semibold transition-all duration-200 ${
                                                    activeTab === tab 
                                                        ? 'bg-purple-600 text-white' 
                                                        : 'text-white hover:bg-white/10'
                                                }`}
                                            >
                                                {tab === 'market' && 'Market Impact'}
                                                {tab === 'question' && 'Critical Question'}
                                                {tab === 'strategy' && 'Peace Strategy'}
                                                {tab === 'cases' && 'Case Studies'}
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                {/* Market Impact Tab */}
                                {activeTab === 'market' && (
                                    <div className="space-y-6">
                                        <h2 className="text-3xl font-bold text-white mb-6">Post-Conflict Market Scenarios</h2>
                                        
                                        {results.scenarios.map((scenario, idx) => (
                                            <div key={idx} className="bg-white/5 backdrop-blur-lg border border-white/10 shadow-xl rounded-lg p-8">
                                                <h3 className="text-2xl font-bold text-white mb-4">{scenario.title}</h3>
                                                <div className="grid grid-cols-4 gap-6">
                                                    <div>
                                                        <p className="text-gray-300 text-sm mb-2 font-semibold">Probability</p>
                                                        <p className="text-4xl font-bold text-purple-400">{scenario.probability}</p>
                                                    </div>
                                                    <div>
                                                        <p className="text-gray-300 text-sm mb-2 font-semibold">Market Size</p>
                                                        <p className="text-3xl font-bold text-white">{scenario.marketSize}</p>
                                                    </div>
                                                    <div>
                                                        <p className="text-gray-300 text-sm mb-2 font-semibold">Revenue Opportunity</p>
                                                        <p className="text-2xl font-bold text-white">{scenario.revenue}</p>
                                                    </div>
                                                    <div>
                                                        <p className="text-gray-300 text-sm mb-2 font-semibold">Impact on Current Revenue</p>
                                                        <p className="text-3xl font-bold text-green-400">{scenario.impact}</p>
                                                    </div>
                                                </div>
                                            </div>
                                        ))}

                                        <div className="bg-gradient-to-r from-purple-900/30 to-pink-900/30 backdrop-blur-lg border border-purple-500/30 shadow-xl rounded-lg p-8">
                                            <h3 className="text-2xl font-bold text-white mb-6">Expected Value (Probability-Weighted)</h3>
                                            <div className="grid grid-cols-2 gap-8">
                                                <div className="text-center">
                                                    <p className="text-gray-200 text-lg mb-3 font-semibold">Revenue Opportunity</p>
                                                    <p className="text-5xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-400">
                                                        {results.expectedValue.revenue}
                                                    </p>
                                                </div>
                                                <div className="text-center">
                                                    <p className="text-gray-200 text-lg mb-3 font-semibold">Impact on Current Revenue</p>
                                                    <p className="text-5xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-green-400 to-emerald-400">
                                                        {results.expectedValue.impact}
                                                    </p>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                )}

                                {/* Critical Question Tab */}
                                {activeTab === 'question' && (
                                    <div className="bg-white/5 backdrop-blur-lg border border-white/10 shadow-xl rounded-lg p-16 text-center">
                                        <div className="text-6xl mb-8">🤔</div>
                                        <p className="text-3xl text-gray-100 mb-8">
                                            If conflict resolution unlocks $30 billion for {company}...
                                        </p>
                                        <p className="text-4xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-400 mb-6">
                                            What can {company} do to help end the war?
                                        </p>
                                        <p className="text-lg text-gray-400 italic">
                                            This is not just a market opportunity. It's a call to action.
                                        </p>
                                    </div>
                                )}

                                {/* Peace Strategy Tab */}
                                {activeTab === 'strategy' && (
                                    <div className="space-y-8">
                                        <h2 className="text-3xl font-bold text-white mb-6">Recommended Peace Marketing Strategies</h2>
                                        
                                        <div>
                                            <h3 className="text-2xl font-bold text-purple-400 mb-4 flex items-center">
                                                <svg className="w-6 h-6 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/>
                                                </svg>
                                                Corporate Initiatives
                                            </h3>
                                            <div className="space-y-4">
                                                {results.strategies.corporate.map((initiative, idx) => (
                                                    <div key={idx} className="bg-white/5 backdrop-blur-lg border border-white/10 shadow-xl rounded-lg p-6">
                                                        <h4 className="text-xl font-bold text-white mb-4">{initiative.title}</h4>
                                                        <ul className="space-y-2 mb-4">
                                                            {initiative.details.map((detail, i) => (
                                                                <li key={i} className="text-gray-200">• {detail}</li>
                                                            ))}
                                                        </ul>
                                                        <div className="grid grid-cols-2 gap-4 mt-4">
                                                            <div>
                                                                <p className="text-gray-300 text-sm font-semibold">Expected Impact</p>
                                                                <p className="text-white">{initiative.expected}</p>
                                                            </div>
                                                            <div>
                                                                <p className="text-gray-300 text-sm font-semibold">Investment</p>
                                                                <p className="text-2xl font-bold text-purple-400">{initiative.investment}</p>
                                                            </div>
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>

                                        <div>
                                            <h3 className="text-2xl font-bold text-purple-400 mb-4 flex items-center">
                                                <svg className="w-6 h-6 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/>
                                                </svg>
                                                Government Lobbying
                                            </h3>
                                            <div className="space-y-4">
                                                {results.strategies.lobbying.map((strategy, idx) => (
                                                    <div key={idx} className="bg-white/5 backdrop-blur-lg border border-white/10 shadow-xl rounded-lg p-6">
                                                        <h4 className="text-xl font-bold text-white mb-4">{strategy.title}</h4>
                                                        <ul className="space-y-2 mb-4">
                                                            {strategy.details.map((detail, i) => (
                                                                <li key={i} className="text-gray-200">• {detail}</li>
                                                            ))}
                                                        </ul>
                                                        <div className="grid grid-cols-2 gap-4 mt-4">
                                                            <div>
                                                                <p className="text-gray-300 text-sm font-semibold">Expected Impact</p>
                                                                <p className="text-white">{strategy.expected}</p>
                                                            </div>
                                                            <div>
                                                                <p className="text-gray-300 text-sm font-semibold">Investment</p>
                                                                <p className="text-2xl font-bold text-purple-400">{strategy.investment}</p>
                                                            </div>
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>

                                        <div className="bg-gradient-to-r from-purple-900/30 to-pink-900/30 backdrop-blur-lg border border-purple-500/30 shadow-xl rounded-lg p-8">
                                            <div className="grid grid-cols-3 gap-8 text-center">
                                                <div>
                                                    <p className="text-gray-200 text-lg mb-2 font-semibold">Total Investment</p>
                                                    <p className="text-3xl font-bold text-white">{results.strategies.summary.total}</p>
                                                </div>
                                                <div>
                                                    <p className="text-gray-200 text-lg mb-2 font-semibold">Expected Return</p>
                                                    <p className="text-3xl font-bold text-green-400">{results.strategies.summary.expectedReturn}</p>
                                                </div>
                                                <div>
                                                    <p className="text-gray-200 text-lg mb-2 font-semibold">ROI</p>
                                                    <p className="text-4xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-400">
                                                        {results.strategies.summary.roi}
                                                    </p>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                )}

                                {/* Case Studies Tab */}
                                {activeTab === 'cases' && (
                                    <div className="space-y-6">
                                        <h2 className="text-3xl font-bold text-white mb-6">Peace Marketing Success Stories</h2>
                                        
                                        {results.caseStudies.map((study, idx) => (
                                            <div key={idx} className="bg-white/5 backdrop-blur-lg border border-white/10 shadow-xl rounded-lg p-6">
                                                <div className="flex items-start justify-between mb-4">
                                                    <div>
                                                        <h3 className="text-2xl font-bold text-purple-400 mb-2">{study.company}</h3>
                                                        <p className="text-xl text-white mb-1">{study.initiative}</p>
                                                        <p className="text-gray-300">{study.region}</p>
                                                    </div>
                                                    <svg className="w-8 h-8 text-yellow-400" fill="currentColor" viewBox="0 0 20 20">
                                                        <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/>
                                                    </svg>
                                                </div>
                                                <p className="text-gray-200 mb-4">{study.description}</p>
                                                <div className="bg-green-900/20 border border-green-500/30 rounded-lg p-4">
                                                    <p className="text-sm text-gray-300 mb-1 font-semibold">Result</p>
                                                    <p className="text-white font-semibold">{study.result}</p>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        ReactDOM.render(<PostConflictMarketAnalyzer />, document.getElementById('root'));
    </script>
</body>
</html>
